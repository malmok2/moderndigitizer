# docs/ 를 GitHub Pages 로 내보낸다.
#
# 저장소에 Pages 가 꺼져 있어도 configure-pages 의 enablement 가 켜 준다 — 설정 화면을
# 손으로 만질 일이 없다. 굽어 놓은 docs/index.html 이 바뀔 때마다 그대로 올라간다.
name: Pages

on:
  push:
    branches:
      - main
      - "claude/busy-rubin-pswc7s"
    paths:
      - "docs/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 올리는 일은 한 번에 하나만. 앞선 배포를 자르지는 않는다.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deploy
        uses: actions/deploy-pages@v4
