# 굽어 놓은 docs/ 를 gh-pages 브랜치로 올린다 → https://malmok2.github.io/moderndigitizer/
#
# Pages 를 <켜는> API 는 Actions 토큰으로 못 건드린다 (Resource not accessible by integration).
# gh-pages 브랜치는 그 API 를 타지 않고, 브랜치가 생기면 Pages 가 알아서 켜진다.
#
# docs/ 트리를 그대로 뿌리로 삼은 커밋 하나를 만들어 force-push 한다. 부모가 없으므로
# gh-pages 는 늘 커밋 한 개짜리로 남는다 — index.html 이 3 MB 라 판본이 쌓이면 곤란하다.
name: Pages

on:
  push:
    branches:
      - main
      - "claude/busy-rubin-pswc7s"
    paths:
      - "docs/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: docs/ 를 gh-pages 로
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          tree=$(git rev-parse "HEAD:docs")
          commit=$(git commit-tree "$tree" -m "publish ${GITHUB_SHA}")
          git push --force origin "$commit:refs/heads/gh-pages"
          echo "올렸다: https://malmok2.github.io/moderndigitizer/" >> "$GITHUB_STEP_SUMMARY"
