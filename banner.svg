<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 96" width="360" height="96" role="img" aria-label="Plot Digitizer v1.1.1">
  <!-- 연구실 홈페이지용 배너. build_digitizer.py 가 1.1.1 을 채워 docs/banner.svg 로 쓴다.
       글꼴은 내장하지 않고 시스템 폰트 스택에 맡긴다 (배너 SVG 가 2 MB 가 되면 곤란). -->
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#f4f6f9"/>
    </linearGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#eef2f7"/>
    </linearGradient>
    <filter id="sh" x="-5%" y="-10%" width="110%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#181f2a" flood-opacity=".14"/>
    </filter>
    <filter id="sh2" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.8" flood-color="#181f2a" flood-opacity=".16"/>
    </filter>
  </defs>
  <!-- 패널: 테두리 없이 그림자 + 위쪽 하이라이트 -->
  <rect x="6" y="6" width="348" height="84" rx="18" fill="url(#panel)" filter="url(#sh)"/>
  <rect x="6.5" y="6.5" width="347" height="1" rx=".5" fill="#ffffff" opacity=".9"/>

  <!-- 아이콘 (icon.svg 와 같은 그림, 64px) -->
  <g transform="translate(18 16) scale(0.6667)">
    <rect x="4" y="4" width="88" height="88" rx="22" fill="url(#bg)" filter="url(#sh2)"/>
    <g fill="none" stroke="#15181c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
      <path d="M23 19 V73 H77"/>
    </g>
    <g fill="none" stroke="#15181c" stroke-width="1.8" stroke-linecap="round" stroke-opacity=".45">
      <path d="M19 61 H23 M19 47 H23 M19 33 H23 M37 73 V77 M51 73 V77 M65 73 V77"/>
    </g>
    <path d="M27 65 C39 63 44 44 53 38 C61 33 68 30 73 28" fill="none" stroke="#0f4c81"
          stroke-width="3" stroke-opacity=".28" stroke-linecap="round"/>
    <g fill="#0f4c81">
      <circle cx="30" cy="64.4" r="4"/><circle cx="43" cy="55.5" r="4"/>
      <circle cx="55" cy="36.6" r="4"/><circle cx="70" cy="28.9" r="4"/>
    </g>
    <g fill="none" stroke="#0f4c81" stroke-width="2" stroke-linecap="round">
      <circle cx="55" cy="36.6" r="9.5" stroke-opacity=".55"/>
      <path d="M55 22 V30 M55 43.2 V51 M40.5 36.6 H48.5 M61.5 36.6 H69.5" stroke-opacity=".8"/>
    </g>
  </g>

  <!-- 글 -->
  <g font-family="'Pretendard Variable',Pretendard,'Noto Sans KR','Malgun Gothic','Segoe UI',Arial,sans-serif">
    <text x="98" y="42" font-size="19" font-weight="700" fill="#15181c" letter-spacing="-0.3">Plot Digitizer</text>
    <text x="98" y="63" font-size="12" font-weight="500" fill="#22262b">논문 그림에서 데이터 뽑기 · 축 맞추기 · CSV</text>
    <!-- 버전 태그 -->
    <rect x="282.0" y="27" width="58.0" height="20" rx="7" fill="#0f4c81" fill-opacity=".11"/>
    <text x="311.0" y="41" font-size="11.5" font-weight="600" fill="#0f4c81" text-anchor="middle" letter-spacing=".3">v1.1.1</text>
    <!-- 열기 화살표 -->
    <text x="98" y="80" font-size="11" font-weight="600" fill="#0f4c81">브라우저에서 바로 열기 →</text>
  </g>
</svg>
